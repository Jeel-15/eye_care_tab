org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's relocatable incremental-cache code throws when the project (J:) and
# the Gradle/Pub dependency caches (C:) are on different drive letters, since
# Windows can't express a relative path across drives - corrupts the cache
# mid-write ("Could not close incremental caches"). Disabling incremental
# compilation avoids that code path entirely.
kotlin.incremental=false
